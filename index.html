<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        /* Lock Screen */
        #lock-screen { position: fixed; width: 100%; height: 100%; background: #111; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .passcode-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; }
        .dot.filled { background: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .key { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }

        /* Gallery Grid */
        #gallery-screen { display: none; width: 100%; height: 100%; background: #000; padding: 2px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; }
        .thumbnail { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; cursor: pointer; }

        /* Fullscreen View Container */
        #fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; overflow: hidden; }
        #viewed-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Hidden Menu Styling */
        #hidden-menu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.98); z-index: 99999; color: #fff; padding: 15px; overflow-y: auto; }
        .menu-title { text-align: center; font-size: 15px; font-weight: 600; color: #aaa; margin-bottom: 12px; letter-spacing: 0.5px; }
        .control-group { margin-bottom: 10px; }
        .control-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #ccc; }
        .control-group input[type="range"] { width: 100%; accent-color: #007aff; }
        .btn { display: block; width: 100%; padding: 12px; border: none; color: white; font-weight: bold; border-radius: 8px; margin-top: 10px; cursor: pointer; font-size: 14px; }
        .btn-green { background: #34c759; }
        .btn-red { background: #ff3b30; }

        /* Preview Outer Box - Locked to Portrait Ratio */
        .preview-outer {
            position: relative;
            width: 170px;
            height: 300px;
            margin: 0 auto 15px auto;
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        #menu-preview-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Identical Relative Coordinate Overlays */
        #preview-time-overlay {
            position: absolute;
            transform-origin: center center;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            line-height: 1;
            z-index: 10;
            display: none;
        }

        #performance-time-overlay {
            position: absolute;
            transform-origin: center center;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            line-height: 1;
            z-index: 6000;
            display: none;
        }
    </style>
</head>
<body>

<!-- Passcode Lock Screen -->
<div id="lock-screen">
    <div style="font-size: 18px; margin-bottom: 40px; font-weight: 300;">Enter Passcode</div>
    <div class="passcode-dots">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
    </div>
    <div class="keypad" id="keypad"></div>
</div>

<!-- Gallery Grid -->
<div id="gallery-screen"></div>

<!-- Full Screen Performance View -->
<div id="fullscreen-view" onclick="closeFullscreen()">
    <img id="viewed-image" src="" alt="">
    <div id="performance-time-overlay">00:00</div>
</div>

<!-- Hidden Configuration Deck -->
<div id="hidden-menu">
    <div class="menu-title">FINE-TUNE ALIGNMENT AXES</div>

    <div class="control-group">
        <label>Horizontal Position (X): <span id="label-x">58%</span></label>
        <input type="range" id="slider-x" min="0" max="100" value="58">
    </div>
    <div class="control-group">
        <label>Vertical Position (Y): <span id="label-y">73%</span></label>
        <input type="range" id="slider-y" min="0" max="100" value="73">
    </div>
    <div class="control-group">
        <label>Font Size: <span id="label-size">14px</span></label>
        <input type="range" id="slider-size" min="6" max="40" value="14">
    </div>
    <div class="control-group">
        <label>Rotation Angle: <span id="label-rot">-1°</span></label>
        <input type="range" id="slider-rot" min="-180" max="180" value="-1">
    </div>

    <div class="menu-title" style="margin-top: 10px; margin-bottom: 8px;">ALIGNMENT CANVAS PREVIEW</div>
    
    <div class="preview-outer" id="preview-box">
        <img id="menu-preview-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>">
        <div id="preview-time-overlay">00:00</div>
    </div>

    <div class="control-group">
        <label>Update Gimmick Photo</label>
        <input type="file" id="gimmick-input" accept="image/*">
    </div>
    <div class="control-group">
        <label>Update Bulk Fillers (Up to 25)</label>
        <input type="file" id="filler-input" accept="image/*" multiple>
    </div>

    <button class="btn btn-green" onclick="saveConfiguration()">Save Settings</button>
    <button class="btn btn-red" onclick="closeHiddenMenu()">Close Menu</button>
</div>

<script>
    let appConfig = JSON.parse(localStorage.getItem('mj_config')) || { x: 58, y: 73, size: 14, rot: -1 };
    let gimmickBase64 = localStorage.getItem('mj_gimmick') || "";
    let fillerImagesArray = JSON.parse(localStorage.getItem('mj_fillers')) || [];
    let enteredCode = "";
    let targetPerformanceTime = "00:00";
    let gimmickedIndexInGallery = 7;

    // Two-Finger Slide Down
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
    });
    document.addEventListener('touchend', (e) => {
        if (touchStartY > 0) {
            let currentY = (e.changedTouches[0].clientY + (e.changedTouches[1] ? e.changedTouches[1].clientY : e.changedTouches[0].clientY)) / 2;
            if (currentY - touchStartY > 120 && touchStartY < 220) {
                openHiddenMenu();
            }
            touchStartY = 0;
        }
    });

    window.onload = function() {
        buildKeypad();
        initSliders();
        if (gimmickBase64) {
            document.getElementById('menu-preview-img').src = gimmickBase64;
        }
    };

    function initSliders() {
        document.getElementById('slider-x').value = appConfig.x;
        document.getElementById('slider-y').value = appConfig.y;
        document.getElementById('slider-size').value = appConfig.size;
        document.getElementById('slider-rot').value = appConfig.rot;
        updateSliderLabels();

        ['slider-x', 'slider-y', 'slider-size', 'slider-rot'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                appConfig = {
                    x: parseFloat(document.getElementById('slider-x').value),
                    y: parseFloat(document.getElementById('slider-y').value),
                    size: parseInt(document.getElementById('slider-size').value),
                    rot: parseInt(document.getElementById('slider-rot').value)
                };
                updateSliderLabels();
                renderOverlay(true);
            });
        });
    }

    function updateSliderLabels() {
        document.getElementById('label-x').innerText = `${appConfig.x}%`;
        document.getElementById('label-y').innerText = `${appConfig.y}%`;
        document.getElementById('label-size').innerText = `${appConfig.size}px`;
        document.getElementById('label-rot').innerText = `${appConfig.rot}°`;
    }

    function openHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'block';
        setTimeout(() => renderOverlay(true), 60);
    }

    function closeHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'none';
        document.getElementById('preview-time-overlay').style.display = 'none';
    }

    /* 
       True Coordinate Calculation Engine
       Calculates positions based solely on container layout, completely immune to menu scrolling.
    */
    function renderOverlay(isMenuPreview = false) {
        const overlay = isMenuPreview ? document.getElementById('preview-time-overlay') : document.getElementById('performance-time-overlay');
        const img = isMenuPreview ? document.getElementById('menu-preview-img') : document.getElementById('viewed-image');
        const container = isMenuPreview ? document.getElementById('preview-box') : document.getElementById('fullscreen-view');

        if (!img || !img.complete || img.naturalWidth === 0) {
            overlay.style.display = 'none';
            return;
        }

        const boxW = container.clientWidth;
        const boxH = container.clientHeight;

        const imgRatio = img.naturalWidth / img.naturalHeight;
        const boxRatio = boxW / boxH;

        let renderW, renderH, offsetX, offsetY;

        if (boxRatio > imgRatio) {
            renderH = boxH;
            renderW = boxH * imgRatio;
            offsetX = (boxW - renderW) / 2;
            offsetY = 0;
        } else {
            renderW = boxW;
            renderH = boxW / imgRatio;
            offsetX = 0;
            offsetY = (boxH - renderH) / 2;
        }

        const targetX = offsetX + (renderW * (appConfig.x / 100));
        const targetY = offsetY + (renderH * (appConfig.y / 100));

        // Auto-scale font proportionally based on preview width (170px)
        const scaleFactor = renderW / 170;
        const dynamicFontSize = Math.max(8, Math.round(appConfig.size * scaleFactor));

        overlay.innerText = isMenuPreview ? "00:00" : targetPerformanceTime;
        overlay.style.left = `${Math.round(targetX)}px`;
        overlay.style.top = `${Math.round(targetY)}px`;
        overlay.style.fontSize = `${dynamicFontSize}px`;
        overlay.style.transform = `translate(-50%, -50%) rotate(${appConfig.rot}deg)`;
        overlay.style.display = 'block';
    }

    function saveConfiguration() {
        localStorage.setItem('mj_config', JSON.stringify(appConfig));
        alert("Settings Saved Successfully!");
    }

    function buildKeypad() {
        const container = document.getElementById('keypad');
        container.innerHTML = "";
        for (let i = 1; i <= 9; i++) {
            container.innerHTML += `<div class="key" onclick="pressKey('${i}')">${i}</div>`;
        }
        container.innerHTML += `<div class="key" style="background:transparent;"></div>`;
        container.innerHTML += `<div class="key" onclick="pressKey('0')">0</div>`;
    }

    function pressKey(num) {
        if (enteredCode.length < 4) {
            enteredCode += num;
            document.getElementById(`d${enteredCode.length}`).classList.add('filled');
        }
        if (enteredCode.length === 4) {
            setTimeout(processUnlockSequence, 180);
        }
    }

    function processUnlockSequence() {
        let hr = enteredCode.substring(0, 2);
        let min = enteredCode.substring(2, 4);
        targetPerformanceTime = `${hr}:${min}`;

        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('gallery-screen').style.display = 'grid';
        generateGalleryGrid();
    }

    function generateGalleryGrid() {
        const grid = document.getElementById('gallery-screen');
        grid.innerHTML = "";

        let totalSlotsCount = Math.max(25, fillerImagesArray.length + 1);
        let fillerPointer = 0;

        for (let i = 0; i < totalSlotsCount; i++) {
            if (i === gimmickedIndexInGallery) {
                let srcImg = gimmickBase64 || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23555'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(true)">`;
            } else {
                let srcImg = fillerImagesArray[fillerPointer] || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(false, '${srcImg}')">`;
                if (fillerImagesArray[fillerPointer]) fillerPointer++;
            }
        }
    }

    function openFullscreen(isGimmick, imgSrc = "") {
        const view = document.getElementById('fullscreen-view');
        const img = document.getElementById('viewed-image');
        const overlay = document.getElementById('performance-time-overlay');

        if (isGimmick) {
            img.src = gimmickBase64;
            view.style.display = 'block';

            img.onload = function() {
                renderOverlay(false);
                setTimeout(() => renderOverlay(false), 50);
            };
            if (img.complete) {
                renderOverlay(false);
                setTimeout(() => renderOverlay(false), 50);
            }
        } else {
            img.src = imgSrc;
            view.style.display = 'block';
            overlay.style.display = 'none';
        }
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').style.display = 'none';
        document.getElementById('performance-time-overlay').style.display = 'none';
    }

    window.addEventListener('resize', () => {
        if (document.getElementById('fullscreen-view').style.display === 'block') {
            renderOverlay(false);
        } else if (document.getElementById('hidden-menu').style.display === 'block') {
            renderOverlay(true);
        }
    });

    document.getElementById('gimmick-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                gimmickBase64 = event.target.result;
                localStorage.setItem('mj_gimmick', gimmickBase64);
                document.getElementById('menu-preview-img').src = gimmickBase64;
                setTimeout(() => renderOverlay(true), 100);
            };
            reader.readAsDataURL(file);
        }
    });

    document.getElementById('filler-input').addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        fillerImagesArray = [];
        let loadedCount = 0;

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(event) {
                fillerImagesArray.push(event.target.result);
                loadedCount++;
                if (loadedCount === files.length) {
                    localStorage.setItem('mj_fillers', JSON.stringify(fillerImagesArray));
                    alert("Bulk Filler Images Stored!");
                }
            };
            reader.readAsDataURL(file);
        });
    });
</script>
</body>
</html>
