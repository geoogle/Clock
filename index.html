<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Photos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --ios-bg: #000000;
            --ios-text: #ffffff;
            --ios-gray: #1c1c1e;
            --ios-blue: #0a84ff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--ios-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* SCREEN MANAGEMENT */
        .app-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            z-index: 10;
        }
        .active-screen { display: flex !important; }

        /* FAKE PASSCODE SCREEN */
        #lockScreen {
            background: #111;
            justify-content: center;
            align-items: center;
            color: var(--ios-text);
        }
        .passcode-header {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        .dots-container {
            display: flex;
            gap: 15px;
            margin-bottom: 60px;
        }
        .dot {
            width: 12px; height: 12px;
            border: 1px solid var(--ios-text);
            border-radius: 50%;
            transition: background 0.1s ease;
        }
        .dot.filled { background: var(--ios-text); }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 25px;
            justify-items: center;
        }
        .key-btn {
            width: 75px; height: 75px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            color: var(--ios-text);
            font-size: 32px; font-weight: 400;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        .key-btn:active { background: rgba(255,255,255,0.2); }
        .key-footer {
            grid-column: span 3;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 0 20px;
            font-size: 15px;
        }
        .footer-text-link {
            opacity: 0.8;
            color: var(--ios-text);
            cursor: pointer;
            width: 110px;
        }
        .footer-text-link:active { opacity: 0.4; }

        /* REALISTIC ANTI-GAP PHOTO GALLERY */
        #galleryScreen { background: var(--ios-bg); color: var(--ios-text); }
        .gallery-header {
            padding: 40px 15px 15px 15px;
            font-size: 34px; font-weight: 700;
            border-bottom: 0.5px solid #2c2c2e;
        }
        .folder-nav-bar {
            display: flex; gap: 15px; padding: 10px 15px;
            overflow-x: auto; white-space: nowrap;
            background: #121212; border-bottom: 0.5px solid #2c2c2e;
        }
        .folder-nav-bar::-webkit-scrollbar { display: none; }
        .folder-tab {
            font-size: 14px; font-weight: 600; color: #8e8e93;
            padding: 6px 12px; border-radius: 15px; background: #2c2c2e;
        }
        .folder-tab.active-tab { color: var(--ios-text); background: var(--ios-blue); }
        .gallery-scroll-container { flex: 1; overflow-y: auto; padding-bottom: 40px; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px; padding: 2px;
        }
        .gallery-item {
            aspect-ratio: 1 / 1; width: 100%; overflow: hidden;
            background: #2c2c2e; cursor: pointer;
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        /* LIGHTBOX VIEW (SPECTATOR VIEW) */
        #lightbox {
            background: #000; justify-content: center; align-items: center;
        }
        .lightbox-wrapper {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #lightboxImg {
            width: 100%; height: 100%; object-fit: contain;
            pointer-events: none; transform-origin: center center;
        }
        #clockText {
            position: absolute; display: none;
            color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 600; text-align: center; white-space: nowrap;
            letter-spacing: -0.5px; z-index: 50; pointer-events: none;
        }

        /* HIDDEN CALIBRATION BACKDOOR AREA */
        #adminPanel {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; color: #fff;
            padding: 30px 20px; display: none; flex-direction: column;
            overflow-y: auto;
        }
        .admin-header { font-size: 24px; font-weight: 700; margin-bottom: 25px; color: var(--ios-blue); }
        .control-group { margin-bottom: 20px; background: var(--ios-gray); padding: 15px; border-radius: 10px; }
        .control-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aeaeb2; }
        .control-group input[type="range"] { width: 100%; margin-top: 5px; }
        .btn-block {
            width: 100%; padding: 14px; background: var(--ios-blue); border: none;
            color: #fff; font-size: 16px; font-weight: 600; border-radius: 10px;
            cursor: pointer; margin-top: 10px;
        }
        .btn-secondary { background: #3a3a3c; margin-top: 10px; }
        .status-text { font-size: 13px; color: #30d158; margin-top: 5px; font-weight: 500; }

        /* LIVE TUNING WORKSPACE CANVAS */
        #tuningWorkspace {
            background: #000; touch-action: none;
        }
        .workspace-canvas {
            position: relative; width: 100%; height: 80%;
            background: #050505; overflow: hidden; display: flex;
            justify-content: center; align-items: center; border-bottom: 1px solid #2c2c2e;
        }
        #workspaceImg {
            width: 100%; height: 100%; object-fit: contain;
            transform-origin: center center; pointer-events: auto; touch-action: none;
        }
        #workspaceClock {
            position: absolute; color: #fff; font-weight: 600;
            white-space: nowrap; pointer-events: auto; touch-action: none;
            z-index: 60; letter-spacing: -0.5px;
        }
        .workspace-footer-controls {
            height: 20%; background: var(--ios-gray); display: flex;
            flex-direction: column; justify-content: center; padding: 0 20px; gap: 10px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: FAKE LOCK / PASSCODE SCREEN -->
    <div id="lockScreen" class="app-screen active-screen">
        <div class="passcode-header">Enter Passcode</div>
        <div class="dots-container">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>
        <div class="keypad-grid">
            <div class="key-btn" onclick="pressKey('1')">1</div>
            <div class="key-btn" onclick="pressKey('2')">2</div>
            <div class="key-btn" onclick="pressKey('3')">3</div>
            <div class="key-btn" onclick="pressKey('4')">4</div>
            <div class="key-btn" onclick="pressKey('5')">5</div>
            <div class="key-btn" onclick="pressKey('6')">6</div>
            <div class="key-btn" onclick="pressKey('7')">7</div>
            <div class="key-btn" onclick="pressKey('8')">8</div>
            <div class="key-btn" onclick="pressKey('9')">9</div>
            <div class="key-footer">
                <span class="footer-text-link" onclick="handleFakeForgot()">Forgot Password?</span>
                <div class="key-btn" style="margin-top:-25px" onclick="pressKey('0')">0</div>
                <span class="footer-text-link" style="text-align: right;" onclick="deleteKey()">Delete</span>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: NATIVE GALLERY LAYOUT -->
    <div id="galleryScreen" class="app-screen">
        <div class="gallery-header">Library</div>
        <div class="folder-nav-bar">
            <div class="folder-tab active-tab" id="lblRecents">Recents (0)</div>
            <div class="folder-tab" id="lblCamera">Camera (0)</div>
            <div class="folder-tab" id="lblWhatsApp">WhatsApp (0)</div>
        </div>
        <div class="gallery-scroll-container">
            <div id="galleryGrid" class="gallery-grid"></div>
        </div>
    </div>

    <!-- SCREEN 3: LIGHTBOX FULL-SCREEN VIEW -->
    <div id="lightbox" class="app-screen">
        <div class="lightbox-wrapper">
            <img id="lightboxImg" src="" alt="View">
            <div id="clockText">00:00</div>
        </div>
    </div>

    <!-- HIDDEN BACKDOOR OPTION MENU -->
    <div id="adminPanel">
        <div class="admin-header">Tuning Control Deck</div>
        
        <div class="control-group">
            <label>1. Configure Gimmick Target Photo</label>
            <input type="file" id="gimmickUpload" accept="image/*" onchange="loadGimmickSource(this)">
        </div>

        <div class="control-group">
            <label>2. Bulk Filler Photos (Max 20)</label>
            <input type="file" id="bulkUpload" accept="image/*" multiple onchange="loadBulkFillers(this)">
            <div id="bulkStatusDisplay" class="status-text">Loaded: 0 Photos</div>
        </div>
        <button class="btn-block" onclick="openTuningWorkspace()">Launch Finger-Dragging Workspace</button>
        <button class="btn-block btn-secondary" onclick="toggleAdminMenu()">Close Setup Deck</button>
    </div>

    <div id="tuningWorkspace" class="app-screen">
        <div class="workspace-canvas">
            <img id="workspaceImg" src="" alt="Workspace Canvas">
            <div id="workspaceClock">00:00</div>
        </div>
        <div class="workspace-footer-controls">
            <div style="display:flex; flex-direction:column; gap:2px;">
                <label style="color:#aaa; font-size:12px;">Fine-tune Font Size & Rotation Sliders:</label>
                <input type="range" id="tSize" min="20" max="120" value="45" oninput="tuneMatrix()">
                <input type="range" id="tRot" min="-90" max="90" value="0" oninput="tuneMatrix()">
                <input type="range" id="bgScale" min="50" max="300" value="100" oninput="tuneMatrix()">
            </div>
            <button class="btn-block" style="margin-top:0;" id="saveAlignment" onclick="saveTuningWorkspace()">Save Alignment Settings</button>
        </div>
    </div>

    <script>
        // APPLICATION MEMORY STORAGE STATE
        let db = {
            gimmick: { src: '', isGimmick: true },
            camera: []
        };
        
        let matrixConfig = {
            x: 50, y: 30, size: 45, rot: 0, bgScale: 100, bgY: 0, isLocked: false
        };

        let performanceTime = "12:00";
        let passcodeBuffer = "";

        // INITIAL DATABASE STORAGE MAP LOADING
        if (localStorage.getItem('mentalism_gallery_db')) {
            db = JSON.parse(localStorage.getItem('mentalism_gallery_db'));
        }
        if (localStorage.getItem('mentalism_matrix_cfg')) {
            matrixConfig = JSON.parse(localStorage.getItem('mentalism_matrix_cfg'));
        }

        // --- 1. DYNAMIC FAKE PASSCODE ROUTINES ---
        function pressKey(num) {
            if (passcodeBuffer.length < 4) {
                passcodeBuffer += num;
                document.getElementById(`dot${passcodeBuffer.length}`).classList.add('filled');
            }
            if (passcodeBuffer.length === 4) {
                setTimeout(() => {
                    let hrs = passcodeBuffer.substring(0, 2);
                    let mins = passcodeBuffer.substring(2, 4);
                    performanceTime = `${hrs}:${mins}`;
                    
                    document.getElementById('clockText').textContent = performanceTime;
                    
                    // Route directly out to the disguised target grid
                    document.getElementById('lockScreen').classList.remove('active-screen');
                    document.getElementById('galleryScreen').classList.add('active-screen');
                    resetPasscodeUI();
                }, 150);
            }
        }

        function deleteKey() {
            if (passcodeBuffer.length > 0) {
                document.getElementById(`dot${passcodeBuffer.length}`).classList.remove('filled');
                passcodeBuffer = passcodeBuffer.slice(0, -1);
            }
        }

        function resetPasscodeUI() {
            passcodeBuffer = "";
            for(let i=1; i<=4; i++) {
                document.getElementById(`dot${i}`).classList.remove('filled');
            }
        }

        function handleFakeForgot() {
            alert("Connection timeout. Please verify network settings.");
        }

        // --- 2. MULTI-TOUCH GESTURE SAFETY BACKDOOR (FIXED ENGINE) ---
        let isSwipeActive = false;
        let startTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isSwipeActive = true;
                startTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            } else {
                isSwipeActive = false;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isSwipeActive || e.touches.length !== 2) return;
            
            let currentTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            let displacement = currentTouchY - startTouchY; 
            
            if (displacement > 70) {
                isSwipeActive = false; 
                toggleAdminMenu();
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            isSwipeActive = false; 
        });

        function toggleAdminMenu() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        // --- 3. RENDERING ENGINE & ASPECT CONTROL GRIDS ---
        function renderGrid() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            let allPhotos = [];
            if (db.gimmick && db.gimmick.src) {
                allPhotos.push(db.gimmick);
            }
            db.camera.forEach(p => allPhotos.push(p));

            const total = allPhotos.length;
            document.getElementById('lblRecents').innerText = `Recents (${total})`;
            document.getElementById('lblCamera').innerText = `Camera (${Math.ceil(total * 0.6)})`;
            document.getElementById('lblWhatsApp').innerText = `WhatsApp (${Math.floor(total * 0.4)})`;

            allPhotos.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                const img = document.createElement('img');
                img.src = item.src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%232c2c2e"/></svg>';
                div.appendChild(img);
                
                div.onclick = () => openLightbox(item);
                grid.appendChild(div);
            });
        }

        // --- 4. LIGHTBOX PRESENTATION VIEWS ---
        function openLightbox(item) {
            document.getElementById('galleryScreen').classList.remove('active-screen');
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const clockEl = document.getElementById('clockText');
            
            img.src = item.src;
            lightbox.classList.add('active-screen');
            
            if (item.isGimmick || item.src === db.gimmick.src) {
                clockEl.style.display = 'flex';
                applyPerspectiveTransform();
            } else {
                clockEl.style.display = 'none';
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active-screen');
            document.getElementById('galleryScreen').classList.add('active-screen');
        }

        function applyPerspectiveTransform() {
            const clockEl = document.getElementById('clockText');
            const lbImg = document.getElementById('lightboxImg');
            
            lbImg.style.transform = `scale(${matrixConfig.bgScale / 100}) translateY(${matrixConfig.bgY}px)`;
            clockEl.style.top = `${matrixConfig.y}%`;
            clockEl.style.left = `${matrixConfig.x}%`;
            clockEl.style.fontSize = `${matrixConfig.size}px`;
            clockEl.style.transform = `translate(-50%, -50%) rotate(${matrixConfig.rot}deg)`;
        }

        // --- 5. INTERACTIVE DRAG WORKSPACE ARCHITECTURE ---
        function openTuningWorkspace() {
            if(!db.gimmick.src) { alert("Please upload a gimmick image first!"); return; }
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('galleryScreen').style.display = 'none';
            
            const wsImg = document.getElementById('workspaceImg');
            wsImg.src = db.gimmick.src;
            document.getElementById('workspaceClock').textContent = "00:00";
            
            document.getElementById('tuningWorkspace').classList.add('active-screen');
            
            document.getElementById('tSize').value = matrixConfig.size;
            document.getElementById('tRot').value = matrixConfig.rot;
            document.getElementById('bgScale').value = matrixConfig.bgScale;
            
            tuneMatrix();
            attachWorkspaceDragListeners();
        }

        function tuneMatrix() {
            matrixConfig.size = document.getElementById('tSize').value;
            matrixConfig.rot = document.getElementById('tRot').value;
            matrixConfig.bgScale = document.getElementById('bgScale').value;
            
            const wsImg = document.getElementById('workspaceImg');
            wsImg.style.transform = `scale(${matrixConfig.bgScale / 100}) translateY(${matrixConfig.bgY}px)`;
            
            const wsClock = document.getElementById('workspaceClock');
            wsClock.style.top = `${matrixConfig.y}%`;
            wsClock.style.left = `${matrixConfig.x}%`;
            wsClock.style.fontSize = `${matrixConfig.size}px`;
            wsClock.style.transform = `translate(-50%, -50%) rotate(${matrixConfig.rot}deg)`;
        }

        let currentActivePointer = null;
        let pStartX = 0, pStartY = 0;
        let pInitialX = 0, pInitialY = 0;

        function attachWorkspaceDragListeners() {
            const clk = document.getElementById('workspaceClock');
            const img = document.getElementById('workspaceImg');
            const workspace = document.querySelector('.workspace-canvas');

            clk.onpointerdown = startPointerDrag;
            img.onpointerdown = startPointerDrag;
            workspace.onpointermove = executePointerDrag;
            window.onpointerup = terminatePointerDrag;
        }

        function startPointerDrag(e) {
            e.preventDefault();
            currentActivePointer = e.currentTarget;
            currentActivePointer.setPointerCapture(e.pointerId);
            pStartX = e.clientX;
            pStartY = e.clientY;
            
            if (currentActivePointer.id === 'workspaceClock') {
                pInitialX = parseFloat(matrixConfig.x);
                pInitialY = parseFloat(matrixConfig.y);
            } else {
                pInitialY = parseFloat(matrixConfig.bgY) || 0;
            }
        }

        function executePointerDrag(e) {
            if (!currentActivePointer) return;
            e.preventDefault();
            
            let dX = e.clientX - pStartX;
            let dY = e.clientY - pStartY;
            const container = document.querySelector('.workspace-canvas');
            
            if (currentActivePointer.id === 'workspaceClock') {
                let pXDelta = (dX / container.clientWidth) * 100;
                let pYDelta = (dY / container.clientHeight) * 100;
                matrixConfig.x = Math.max(0, Math.min(100, pInitialX + pXDelta)).toFixed(1);
                matrixConfig.y = Math.max(0, Math.min(100, pInitialY + pYDelta)).toFixed(1);
            } else {
                matrixConfig.bgY = Math.round(pInitialY + dY);
            }
            tuneMatrix();
        }

        function terminatePointerDrag(e) {
            if (currentActivePointer) {
                currentActivePointer.releasePointerCapture(e.pointerId);
                currentActivePointer = null;
            }
        }

        function saveTuningWorkspace() {
            localStorage.setItem('mentalism_matrix_cfg', JSON.stringify(matrixConfig));
            document.getElementById('tuningWorkspace').classList.remove('active-screen');
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('galleryScreen').classList.add('active-screen');
            renderGrid();
        }

        // --- 6. FILE PIPELINE PROCESSING INGESTION ---
        function loadGimmickSource(input) {
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                db.gimmick = { src: e.target.result, isGimmick: true };
                localStorage.setItem('mentalism_gallery_db', JSON.stringify(db));
                renderGrid();
            };
            reader.readAsDataURL(input.files[0]);
        }

        function loadBulkFillers(input) {
            const files = Array.from(input.files).slice(0, 20); 
            if (files.length === 0) return;
            db.camera = [];
            let processed = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.camera.push({ src: e.target.result, isGimmick: false });
                    processed++;
                    if (processed === files.length) {
                        localStorage.setItem('mentalism_gallery_db', JSON.stringify(db));
                        document.getElementById('bulkStatusDisplay').innerText = `Loaded: ${processed} Photos`;
                        renderGrid();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // --- 7. FIXED BULLETPROOF ANTI-EXIT TRAP ---
        (function() {
            let backActionCount = 0;
            let backActionTimer = null;

            function commitStateStack() {
                if (!window.history.state || window.history.state.perfActive !== true) {
                    window.history.pushState({ perfActive: true }, "");
                }
            }
            
            // Generate infinite baseline stack layers right away on load
            commitStateStack();
            window.history.pushState({ perfActive: true }, "");

            window.addEventListener('popstate', function() {
                const lightbox = document.getElementById('lightbox');
                const workspace = document.getElementById('tuningWorkspace');
                const adminPanel = document.getElementById('adminPanel');

                if (workspace && workspace.classList.contains('active-screen')) {
                    document.getElementById('tuningWorkspace').classList.remove('active-screen');
                    document.getElementById('galleryScreen').classList.add('active-screen');
                    commitStateStack();
                    return;
                }

                if (adminPanel && adminPanel.style.display === 'block') {
                    adminPanel.style.display = 'none';
                    commitStateStack();
                    return;
                }

                if (lightbox && lightbox.classList.contains('active-screen')) {
                    closeLightbox();
                    commitStateStack();
                    return;
                }

                // SECURE TRAP: Enforce multiple attempts (Double-Click) requirement to leave gallery screen
                backActionCount++;
                if (backActionCount === 1) {
                    renderSystemOverlayToast("Press back again to exit");
                    backActionTimer = setTimeout(() => { backActionCount = 0; }, 2000);
                    commitStateStack(); // Push extra layer instantly to freeze exit routing completely
                } else if (backActionCount >= 2) {
                    clearTimeout(backActionTimer);
                    // Explicitly let it dump back out once threshold requirements are intentionally bypassed
                    window.history.go(-2); 
                }
            });

            function renderSystemOverlayToast(text) {
                let toast = document.getElementById('sys-toast');
                if(!toast) {
                    toast = document.createElement('div');
                    toast.id = 'sys-toast';
                    toast.style.cssText = `
                        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
                        background: rgba(40,40,40,0.95); color: #fff; padding: 12px 24px;
                        border-radius: 30px; font-family: sans-serif; font-size: 14px;
                        z-index: 100000; opacity:0; transition: opacity 0.2s ease; pointer-events:none;
                    `;
                    document.body.appendChild(toast);
                }
                toast.innerText = text;
                toast.style.opacity = '1';
                setTimeout(() => { toast.style.opacity = '0'; }, 1800);
            }

            window.addEventListener('touchend', commitStateStack);
            window.addEventListener('click', commitStateStack);
        })();

        window.onload = renderGrid;
    </script>
</body>
</html>
