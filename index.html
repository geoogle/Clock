<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* --- LOCK SCREEN / PASSCODE --- */
        #lockScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .passcode-header {
            color: #fff;
            font-size: 18px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        .dots-container {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border: 1px solid #fff;
            border-radius: 50%;
            transition: background 0.1s;
        }
        .dot.filled {
            background: #fff;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 25px;
            justify-items: center;
            width: 280px;
        }
        .key {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #1c1c1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .key:active {
            background: #3a3a3c;
        }
        .key .num {
            font-size: 30px;
            font-weight: 400;
            line-height: 1;
        }
        .key .letters {
            font-size: 10px;
            color: #8e8e93;
            letter-spacing: 0.5px;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .key-action {
            grid-column: 3;
            background: transparent;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            width: 75px;
            height: 75px;
        }

        /* --- APP CONTAINER / APP GALLERY --- */
        #appContainer {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            background: #000;
        }
        .gallery-header {
            padding: 20px 15px 10px;
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            border-bottom: 0.5px solid #1c1c1e;
        }
        .gallery-nav {
            display: flex;
            gap: 15px;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-item {
            color: #0a84ff;
            font-size: 14px;
            padding: 6px 12px;
            background: #1c1c1e;
            border-radius: 15px;
        }
        .grid-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }
        .grid-item {
            aspect-ratio: 1;
            background: #1c1c1e;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- LIGHTBOX (PERFORMANCE LOOK) --- */
        #lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            overflow: hidden;
        }
        #lightboxImg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }
        #clockText {
            position: absolute;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 600;
            white-space: nowrap;
            display: none;
            pointer-events: none;
            z-index: 21;
        }

        /* --- ADMIN TUNING CONTROLS MENU --- */
        #adminPanel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 28, 30, 0.95);
            border-top: 1px solid #3a3a3c;
            padding: 15px;
            color: #fff;
            display: none;
            z-index: 30;
            max-height: 50%;
            overflow-y: auto;
        }
        .admin-section {
            margin-bottom: 15px;
        }
        .admin-section h3 {
            font-size: 14px;
            color: #8e8e93;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .admin-btn {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .admin-btn.danger { background: #ff453a; }
        .file-input-label {
            display: inline-block;
            background: #3a3a3c;
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 5px;
        }
        input[type="file"] { display: none; }
        .status-text {
            font-size: 12px;
            color: #30d158;
            margin-top: 4px;
        }

        /* --- TUNING MANIPULATION WORKSPACE --- */
        #tuningWorkspace {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            z-index: 40;
            overflow: hidden;
            touch-action: none;
        }
        #workspaceImg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: auto;
            touch-action: none;
        }
        #workspaceClock {
            position: absolute;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            pointer-events: auto;
            touch-action: none;
            z-index: 41;
        }
        #workspaceControls {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 12px;
            padding: 15px;
            z-index: 42;
            border: 1px solid #1c1c1e;
        }
        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: #fff;
            font-size: 13px;
        }
        .control-row label { width: 90px; color: #8e8e93; }
        .control-row input[type="range"] { flex: 1; margin: 0 10px; }
        .control-row span { width: 40px; text-align: right; }
    </style>
</head>
<body>

    <!-- 1. LOCK SCREEN / INPUT ENGINE -->
    <div id="lockScreen">
        <div class="passcode-header">Enter Passcode</div>
        <div class="dots-container">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>
        <div class="keypad">
            <div class="key" onclick="pressKey('1')"><span class="num">1</span></div>
            <div class="key" onclick="pressKey('2')"><span class="num">2</span><span class="letters">abc</span></div>
            <div class="key" onclick="pressKey('3')"><span class="num">3</span><span class="letters">def</span></div>
            <div class="key" onclick="pressKey('4')"><span class="num">4</span><span class="letters">ghi</span></div>
            <div class="key" onclick="pressKey('5')"><span class="num">5</span><span class="letters">jkl</span></div>
            <div class="key" onclick="pressKey('6')"><span class="num">6</span><span class="letters">mno</span></div>
            <div class="key" onclick="pressKey('7')"><span class="num">7</span><span class="letters">pqrs</span></div>
            <div class="key" onclick="pressKey('8')"><span class="num">8</span><span class="letters">tuv</span></div>
            <div class="key" onclick="pressKey('9')"><span class="num">9</span><span class="letters">wxyz</span></div>
            <div class="key" style="grid-column: 2" onclick="pressKey('0')"><span class="num">0</span></div>
            <div class="key-action" onclick="pressDelete()">Delete</div>
        </div>
    </div>

    <!-- 2. MAIN APPLICATION GALLERY GRID -->
    <div id="appContainer">
        <div class="gallery-header">Library</div>
        <div class="gallery-nav">
            <span class="nav-item">Recents</span>
            <span class="nav-item">Camera</span>
            <span class="nav-item">Downloads</span>
            <span class="nav-item">WhatsApp</span>
        </div>
        <div class="grid-container" id="galleryGrid">
            <!-- Populated dynamically via state array templates -->
        </div>
    </div>

    <!-- 3. SCREEN LIGHTBOX OVERLAY VIEWER -->
    <div id="lightbox">
        <img id="lightboxImg" src="" alt="Viewer">
        <div id="clockText">12:00</div>
    </div>

    <!-- 4. HIDDEN MANAGEMENT/CALIBRATION CONTROL BAR -->
    <div id="adminPanel">
        <div class="admin-section">
            <h3>Gimmick Slot Target Asset</h3>
            <label class="file-input-label" for="gimmickUpload">Choose Prediction Canvas Photo</label>
            <input type="file" id="gimmickUpload" accept="image/*" onchange="loadLocalImage(this)">
        </div>
        <div class="admin-section">
            <h3>Random Fillers Assets Catalog (Max 12)</h3>
            <label class="file-input-label" for="bulkUpload">Upload Random Backgrounds</label>
            <input type="file" id="bulkUpload" accept="image/*" multiple onchange="loadBulkFillers(this)">
            <div class="status-text" id="bulkStatusDisplay">Loaded: 0 Photos</div>
        </div>
        <div class="admin-section">
            <h3>Workspace Actions</h3>
            <button class="admin-btn" onclick="openTuningWorkspace()">✨ Adjust Preview Position</button>
            <button class="admin-btn danger" onclick="toggleAdminMenu()">Close Setup Panel</button>
        </div>
    </div>

    <!-- 5. TUNING CALIBRATION RE-ALIGNMENT CANVAS -->
    <div id="tuningWorkspace">
        <img id="workspaceImg" src="" alt="Workspace Setup">
        <div id="workspaceClock">00:00</div>
        
        <div id="workspaceControls">
            <div class="control-row">
                <label>Image Scale</label>
                <input type="range" id="bgScale" min="10" max="300" value="100" oninput="tuneMatrix()">
                <span id="vScale">100%</span>
            </div>
            <div class="control-row">
                <label>Font Sizing</label>
                <input type="range" id="tSize" min="10" max="120" value="35" oninput="tuneMatrix()">
                <span id="vSize">35px</span>
            </div>
            <div class="control-row">
                <label>Clock Rotation</label>
                <input type="range" id="tRot" min="-180" max="180" value="0" oninput="tuneMatrix()">
                <span id="vRot">0°</span>
            </div>
            <div style="display:none;">
                <input type="range" id="tX" min="0" max="100" value="50" oninput="tuneMatrix()">
                <input type="range" id="tY" min="0" max="100" value="50" oninput="tuneMatrix()">
                <input type="range" id="bgY" min="-1000" max="1000" value="0" oninput="tuneMatrix()">
            </div>
            <button class="admin-btn" style="width:100%; background:#30d158; margin-top:5px;" onclick="closeTuningWorkspace()">✔ Save Alignment</button>
        </div>
    </div>

    <script>
        // --- CENTRAL APPLICATION DATABASE STATE ---
        let db = {
            gimmick: { src: '', isGimmick: true },
            camera: []
        };

        let matrixConfig = {
            x: 50, y: 50,
            size: 35, rot: 0,
            bgScale: 100, bgY: 0
        };

        let currentInputPasscode = "";
        let finalPerformanceTime = "12:00";

        // Load initialization settings from persistence cache stores
        if (localStorage.getItem('mentalism_gallery_db')) {
            db = JSON.parse(localStorage.getItem('mentalism_gallery_db'));
        }
        if (localStorage.getItem('mentalism_matrix_cfg')) {
            matrixConfig = JSON.parse(localStorage.getItem('mentalism_matrix_cfg'));
        }

        // --- FAKE PASSCODE PREDICTION ENGINE ---
        function pressKey(num) {
            if (currentInputPasscode.length < 4) {
                currentInputPasscode += num;
                updatePasscodeDots();
            }
            if (currentInputPasscode.length === 4) {
                setTimeout(() => {
                    let hours = currentInputPasscode.substring(0, 2);
                    let minutes = currentInputPasscode.substring(2, 4);
                    finalPerformanceTime = hours + ":" + minutes;
                    
                    document.getElementById('clockText').innerText = finalPerformanceTime;
                    
                    document.getElementById('lockScreen').style.display = 'none';
                    document.getElementById('appContainer').style.display = 'flex';
                    currentInputPasscode = "";
                    updatePasscodeDots();
                }, 200);
            }
        }

        function pressDelete() {
            if (currentInputPasscode.length > 0) {
                currentInputPasscode = currentInputPasscode.slice(0, -1);
                updatePasscodeDots();
            }
        }

        function updatePasscodeDots() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById('dot' + i);
                if (i <= currentInputPasscode.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        // --- GRID RENDERING INTERFACE MODULE ---
        function renderGrid() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            // Inject primary calibration gimmick asset slot cleanly
            const gimmickItem = document.createElement('div');
            gimmickItem.className = 'grid-item';
            const gimmickImg = document.createElement('img');
            gimmickImg.src = db.gimmick.src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="%231c1c1e"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%238e8e93" font-size="10">Target Slot</text></svg>';
            gimmickItem.appendChild(gimmickImg);
            gimmickItem.onclick = function() { openLightbox({ src: db.gimmick.src, isGimmick: true }); };
            grid.appendChild(gimmickItem);

            // Populates dynamic catalog buffers up to standard filler allocations
            db.camera.forEach((item) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'grid-item';
                const img = document.createElement('img');
                img.src = item.src;
                itemDiv.appendChild(img);
                itemDiv.onclick = function() { openLightbox(item); };
                grid.appendChild(itemDiv);
            });
        }

        // --- INTERACTIVE VIEWER CONTROLLER (PERFORMANCE STATE) ---
        function openLightbox(item) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            const clockEl = document.getElementById('clockText');
            
            img.src = item.src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23000"/></svg>';
            lightbox.style.display = 'flex';
            
            if (item.isGimmick) {
                clockEl.style.display = 'flex';
                applyPerspectiveTransform();
                lightbox.onclick = closeLightbox; 
            } else {
                clockEl.style.display = 'none';
                lightbox.onclick = closeLightbox;
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function applyPerspectiveTransform() {
            const clockEl = document.getElementById('clockText');
            const lbImg = document.getElementById('lightboxImg');
            if(clockEl.style.display === 'none') return;
            
            lbImg.style.transform = `scale(${matrixConfig.bgScale / 100}) translateY(${matrixConfig.bgY}px)`;
            clockEl.style.top = `${matrixConfig.y}%`;
            clockEl.style.left = `${matrixConfig.x}%`;
            clockEl.style.fontSize = `${matrixConfig.size}px`;
            clockEl.style.transform = `translate(-50%, -50%) rotate(${matrixConfig.rot}deg)`;
        }

        // --- TWO-FINGER HIDDEN BACKDOOR EVENT ACTIVATION ---
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                toggleAdminMenu();
            }
        }, { passive: false });

        function toggleAdminMenu() {
            const panel = document.getElementById('adminPanel');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
        }

        // --- WORKSPACE CALIBRATION PIPELINE CONTROLLERS ---
        function openTuningWorkspace() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('lightbox').style.display = 'none';
            
            const wsImg = document.getElementById('workspaceImg');
            wsImg.src = db.gimmick.src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%231c1c1e"/></svg>';
            
            // Sync current slider layout positions on entry load
            document.getElementById('bgScale').value = matrixConfig.bgScale;
            document.getElementById('tSize').value = matrixConfig.size;
            document.getElementById('tRot').value = matrixConfig.rot;
            document.getElementById('tX').value = matrixConfig.x;
            document.getElementById('tY').value = matrixConfig.y;
            document.getElementById('bgY').value = matrixConfig.bgY;

            document.getElementById('tuningWorkspace').style.display = 'flex';
            tuneMatrix();
            initializeDragMechanics();
        }

        function closeTuningWorkspace() {
            document.getElementById('tuningWorkspace').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'block';
        }

        function tuneMatrix() {
            matrixConfig.x = document.getElementById('tX').value;
            matrixConfig.y = document.getElementById('tY').value;
            matrixConfig.size = document.getElementById('tSize').value;
            matrixConfig.rot = document.getElementById('tRot').value;
            matrixConfig.bgScale = document.getElementById('bgScale').value;
            matrixConfig.bgY = document.getElementById('bgY').value;

            // Update UI Value Labels
            document.getElementById('vScale').innerText = matrixConfig.bgScale + "%";
            document.getElementById('vSize').innerText = matrixConfig.size + "px";
            document.getElementById('vRot').innerText = matrixConfig.rot + "°";

            localStorage.setItem('mentalism_matrix_cfg', JSON.stringify(matrixConfig));
            
            const wsImg = document.getElementById('workspaceImg');
            wsImg.style.transform = `scale(${matrixConfig.bgScale / 100}) translateY(${matrixConfig.bgY}px)`;
            
            const wsClock = document.getElementById('workspaceClock');
            wsClock.style.innerText = "00:00";
            wsClock.style.top = `${matrixConfig.y}%`;
            wsClock.style.left = `${matrixConfig.x}%`;
            wsClock.style.fontSize = `${matrixConfig.size}px`;
            wsClock.style.transform = `translate(-50%, -50%) rotate(${matrixConfig.rot}deg)`;
        }

        // --- DIRECT POINTER EVENT DRAG CONTROLLER ENGINE ---
        let activeDragTarget = null;
        let dragStartX, dragStartY;
        let initialElementX, initialElementY;

        function initializeDragMechanics() {
            const wsClock = document.getElementById('workspaceClock');
            const wsImg = document.getElementById('workspaceImg');
            const workspace = document.getElementById('tuningWorkspace');

            if (!wsClock || !wsImg || !workspace) return;

            wsClock.onpointerdown = startWorkspaceDrag;
            wsImg.onpointerdown = startWorkspaceDrag;
            
            workspace.onpointermove = executeWorkspaceDrag;
            window.onpointerup = terminateWorkspaceDrag;
        }

        function startWorkspaceDrag(e) {
            e.preventDefault();
            activeDragTarget = e.currentTarget;
            activeDragTarget.setPointerCapture(e.pointerId);
            
            dragStartX = e.clientX;
            dragStartY = e.clientY;

            if (activeDragTarget.id === 'workspaceClock') {
                initialElementX = parseFloat(matrixConfig.x);
                initialElementY = parseFloat(matrixConfig.y);
            } else if (activeDragTarget.id === 'workspaceImg') {
                initialElementY = parseFloat(matrixConfig.bgY) || 0;
            }
        }

        function executeWorkspaceDrag(e) {
            if (!activeDragTarget) return;
            e.preventDefault();

            const deltaX = e.clientX - dragStartX;
            const deltaY = e.clientY - dragStartY;
            const container = document.getElementById('tuningWorkspace');
            
            if (activeDragTarget.id === 'workspaceClock') {
                const pctDeltaX = (deltaX / container.clientWidth) * 100;
                const pctDeltaY = (deltaY / container.clientHeight) * 100;
                
                matrixConfig.x = Math.max(0, Math.min(100, initialElementX + pctDeltaX)).toFixed(1);
                matrixConfig.y = Math.max(0, Math.min(100, initialElementY + pctDeltaY)).toFixed(1);
                
                document.getElementById('tX').value = matrixConfig.x;
                document.getElementById('tY').value = matrixConfig.y;
                
            } else if (activeDragTarget.id === 'workspaceImg') {
                matrixConfig.bgY = Math.round(initialElementY + deltaY);
                document.getElementById('bgY').value = matrixConfig.bgY;
            }

            tuneMatrix();
        }

        function terminateWorkspaceDrag(e) {
            if (activeDragTarget) {
                activeDragTarget.releasePointerCapture(e.pointerId);
                activeDragTarget = null;
            }
        }

        // --- ASSET FILE INGESTION MODULES ---
        function loadLocalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                db.gimmick = { src: e.target.result, isGimmick: true };
                localStorage.setItem('mentalism_gallery_db', JSON.stringify(db));
                renderGrid();
            };
            reader.readAsDataURL(file);
        }

        function loadBulkFillers(input) {
            const files = Array.from(input.files).slice(0, 12);
            if(files.length === 0) return;
            db.camera = [];
            let loadedCount = 0;
            
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.camera.push({ src: e.target.result });
                    loadedCount++;
                    document.getElementById('bulkStatusDisplay').innerText = `Loading: ${loadedCount}/${files.length} Photos`;
                    if(loadedCount === files.length) {
                        localStorage.setItem('mentalism_gallery_db', JSON.stringify(db));
                        document.getElementById('bulkStatusDisplay').innerText = `Loaded: ${loadedCount} Photos`;
                        renderGrid();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        window.onload = renderGrid;
    </script>
</body>
</html>
