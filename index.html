<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    
    <!-- PWA Setup Headers -->
    <link rel="manifest" href="/Clock/manifest.json">
    <link rel="icon" type="image/png" href="/Clock/app-icon.png">
    <link rel="apple-touch-icon" href="/Clock/app-icon.png">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        /* Lock Screen */
        #lock-screen { position: fixed; width: 100%; height: 100%; background: #111; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .passcode-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; }
        .dot.filled { background: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .key { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; transition: background 0.1s; }
        .key:active { background: rgba(255,255,255,0.3); }
        .key-action { font-size: 16px; font-weight: 500; background: transparent; }
        .forgot-link { margin-top: 30px; color: #8e8e93; font-size: 14px; cursor: pointer; }

        /* Gallery Grid */
        #gallery-screen { display: none; width: 100%; height: 100%; background: #000; padding: 2px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; }
        .thumbnail { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; cursor: pointer; }

        /* Fullscreen View Container */
        #fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; align-items: center; justify-content: center; }

        /* Gallery Overlay Chrome UI */
        .viewer-bar {
            position: absolute;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            z-index: 7000;
            color: #fff;
            transition: opacity 0.25s ease;
        }
        .viewer-bar.top { top: 0; }
        .viewer-bar.bottom {
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 20%, transparent);
            justify-content: space-around;
            padding: 16px 10px 26px 10px;
        }
        .viewer-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            color: #fff;
            font-size: 11px;
            opacity: 0.9;
        }
        .viewer-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .ai-pill {
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Hidden Menu Styling */
        #hidden-menu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.98); z-index: 99999; color: #fff; padding: 18px; overflow-y: auto; }
        
        .fancy-header { 
            font-family: 'Georgia', serif; 
            font-style: italic; 
            text-align: center; 
            font-size: 26px; 
            color: #d4af37;
            margin-top: 10px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .config-card {
            background: #1c1c1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #2c2c2e;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .custom-file-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            margin-bottom: 6px;
            text-align: center;
        }
        .btn-blue { background: #007aff; }
        .btn-purple { background: #5856d6; }
        
        .upload-status {
            font-size: 12px;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .control-group { margin-bottom: 14px; }
        .control-group label { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: #ccc; }
        .control-group input[type="range"] { width: 100%; accent-color: #007aff; }

        .preview-outer {
            width: 100%;
            height: 300px;
            background: #000;
            border: 1px dashed #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .image-stage {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
            line-height: 0;
        }

        .stage-img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
        }

        /* Direct Relative Time Layer */
        .dynamic-time {
            position: absolute;
            transform-origin: center center;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            z-index: 10;
            line-height: 1;
            display: none;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        .btn-green { background: #34c759; }
        .btn-red { background: #ff3b30; }
    </style>
</head>
<body>

<!-- Passcode Lock Screen -->
<div id="lock-screen">
    <div style="font-size: 18px; margin-bottom: 40px; font-weight: 300;">Enter Passcode</div>
    <div class="passcode-dots">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
    </div>
    
    <div class="keypad" id="keypad"></div>

    <div class="forgot-link" onclick="handleForgotPasscode()">Forgot Passcode?</div>
</div>

<!-- Gallery Grid -->
<div id="gallery-screen"></div>

<!-- Full Screen Performance View -->
<div id="fullscreen-view" onclick="toggleViewerChrome()">
    <!-- Top Native Gallery Chrome -->
    <div class="viewer-bar top" id="viewer-chrome-top">
        <div class="viewer-btn" onclick="event.stopPropagation(); closeFullscreen();">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <div style="font-size: 14px; font-weight: 500;">Details</div>
        <div style="display:flex; gap:16px;">
            <div class="viewer-btn"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
            <div class="viewer-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></div>
        </div>
    </div>

    <div class="image-stage" id="performance-stage">
        <img id="viewed-image" class="stage-img" src="" alt="">
        <div id="performance-time-overlay" class="dynamic-time">00:00</div>
    </div>

    <!-- Bottom Native Gallery Chrome -->
    <div class="viewer-bar bottom" id="viewer-chrome-bottom">
        <div class="viewer-btn" onclick="event.stopPropagation(); fakeToast('Preparing image to share...');">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            <span>Share</span>
        </div>

        <div class="viewer-btn" onclick="event.stopPropagation(); fakeToast('Loading photo editor...');">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            <span>Edit</span>
        </div>

        <div class="viewer-btn" onclick="event.stopPropagation(); fakeToast('AI Object Eraser & Enhance ready');">
            <div class="ai-pill">✨ AI Edit</div>
        </div>

        <div class="viewer-btn" onclick="event.stopPropagation(); fakeToast('Cannot delete protected item.');">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span>Delete</span>
        </div>
    </div>
</div>

<!-- Hidden Configuration Deck -->
<div id="hidden-menu">
    <div class="fancy-header">With Love Mentalist Jagath</div>

    <!-- Section 1: Configure Photos -->
    <div class="config-card">
        <div class="card-title">1. Configure Photos</div>
        
        <label class="custom-file-btn btn-blue">
            📁 Upload Gimmick Target Photo
            <input type="file" id="gimmick-input" accept="image/*" style="display:none;">
        </label>
        <div id="gimmick-status" class="upload-status" style="color: #4cd964;">Target Gimmick Ready</div>

        <label class="custom-file-btn btn-purple">
            📚 Upload Bulk Filler Photos (Max 25)
            <input type="file" id="filler-input" accept="image/*" multiple style="display:none;">
        </label>
        <div id="filler-status" class="upload-status" style="color: #4cd964;">0 / 25 Photos Loaded</div>
    </div>

    <!-- Section 2: Fine-Tune Alignment Axes -->
    <div class="config-card">
        <div class="card-title">2. Fine-Tune Alignment Axes</div>

        <div class="control-group">
            <label><span>Horizontal Position (X)</span> <span id="label-x">58%</span></label>
            <input type="range" id="slider-x" min="0" max="100" value="58">
        </div>
        <div class="control-group">
            <label><span>Vertical Position (Y)</span> <span id="label-y">73%</span></label>
            <input type="range" id="slider-y" min="0" max="100" value="73">
        </div>
        <div class="control-group">
            <label><span>Font Size</span> <span id="label-size">24px</span></label>
            <input type="range" id="slider-size" min="8" max="60" value="24">
        </div>
        <div class="control-group">
            <label><span>Rotation Angle</span> <span id="label-rot">-1°</span></label>
            <input type="range" id="slider-rot" min="-180" max="180" value="-1">
        </div>
    </div>

    <!-- Section 3: Alignment Canvas Preview -->
    <div class="config-card">
        <div class="card-title">Alignment Canvas Preview</div>
        
        <div class="preview-outer">
            <div class="image-stage" id="preview-stage">
                <img id="menu-preview-img" class="stage-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>">
                <div id="preview-time-overlay" class="dynamic-time">00:00</div>
            </div>
        </div>

        <button class="btn-action btn-green" onclick="saveConfiguration()">Save Settings</button>
        <button class="btn-action btn-red" onclick="closeHiddenMenu()">Close Menu</button>
    </div>
</div>
<script>
    let appConfig = JSON.parse(localStorage.getItem('mj_config')) || { x: 58, y: 73, size: 24, rot: -1 };
    let gimmickBase64 = localStorage.getItem('mj_gimmick') || "";
    let fillerImagesArray = JSON.parse(localStorage.getItem('mj_fillers')) || [];
    let enteredCode = "";
    let targetPerformanceTime = "00:00";
    let gimmickedIndexInGallery = 7;
    let chromeVisible = true;

    // Two-Finger Slide Down
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
    });
    document.addEventListener('touchend', (e) => {
        if (touchStartY > 0) {
            let currentY = (e.changedTouches[0].clientY + (e.changedTouches[1] ? e.changedTouches[1].clientY : e.changedTouches[0].clientY)) / 2;
            if (currentY - touchStartY > 120 && touchStartY < 220) {
                openHiddenMenu();
            }
            touchStartY = 0;
        }
    });

    window.onload = function() {
        buildKeypad();
        initSliders();
        if (gimmickBase64) {
            document.getElementById('menu-preview-img').src = gimmickBase64;
            document.getElementById('gimmick-status').innerText = "Target Gimmick Ready";
            document.getElementById('gimmick-status').style.color = "#4cd964";
        } else {
            document.getElementById('gimmick-status').innerText = "No image loaded";
            document.getElementById('gimmick-status').style.color = "#ff3b30";
        }

        if (fillerImagesArray.length > 0) {
            document.getElementById('filler-status').innerText = `${fillerImagesArray.length} / 25 Photos Loaded`;
        }
    };

    function buildKeypad() {
        const container = document.getElementById('keypad');
        container.innerHTML = "";
        for (let i = 1; i <= 9; i++) {
            container.innerHTML += `<div class="key" onclick="pressKey('${i}')">${i}</div>`;
        }
        container.innerHTML += `<div class="key key-action"></div>`;
        container.innerHTML += `<div class="key" onclick="pressKey('0')">0</div>`;
        container.innerHTML += `<div class="key key-action" onclick="deleteDigit()">⌫</div>`;
    }

    function pressKey(num) {
        if (enteredCode.length < 4) {
            enteredCode += num;
            document.getElementById(`d${enteredCode.length}`).classList.add('filled');
        }
        if (enteredCode.length === 4) {
            setTimeout(processUnlockSequence, 180);
        }
    }

    function deleteDigit() {
        if (enteredCode.length > 0) {
            document.getElementById(`d${enteredCode.length}`).classList.remove('filled');
            enteredCode = enteredCode.slice(0, -1);
        }
    }

    function handleForgotPasscode() {
        alert("Passcode recovery is currently disabled for security. Please contact your device administrator.");
    }

    function processUnlockSequence() {
        let hr = enteredCode.substring(0, 2);
        let min = enteredCode.substring(2, 4);
        targetPerformanceTime = `${hr}:${min}`;

        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('gallery-screen').style.display = 'grid';
        generateGalleryGrid();
    }

    function generateGalleryGrid() {
        const grid = document.getElementById('gallery-screen');
        grid.innerHTML = "";

        let totalSlotsCount = Math.max(25, fillerImagesArray.length + 1);
        let fillerPointer = 0;

        for (let i = 0; i < totalSlotsCount; i++) {
            if (i === gimmickedIndexInGallery) {
                let srcImg = gimmickBase64 || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23555'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(true)">`;
            } else {
                let srcImg = fillerImagesArray[fillerPointer] || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(false, '${srcImg}')">`;
                if (fillerImagesArray[fillerPointer]) fillerPointer++;
            }
        }
    }

    function openFullscreen(isGimmick, imgSrc = "") {
        const view = document.getElementById('fullscreen-view');
        const img = document.getElementById('viewed-image');
        const overlay = document.getElementById('performance-time-overlay');

        chromeVisible = true;
        document.getElementById('viewer-chrome-top').style.opacity = '1';
        document.getElementById('viewer-chrome-bottom').style.opacity = '1';

        if (isGimmick) {
            img.src = gimmickBase64;
            view.style.display = 'flex';

            img.onload = function() {
                renderOverlay(false);
                setTimeout(() => renderOverlay(false), 50);
            };
            if (img.complete) {
                renderOverlay(false);
                setTimeout(() => renderOverlay(false), 50);
            }
        } else {
            img.src = imgSrc;
            view.style.display = 'flex';
            overlay.style.display = 'none';
        }
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').style.display = 'none';
        document.getElementById('performance-time-overlay').style.display = 'none';
    }

    function toggleViewerChrome() {
        chromeVisible = !chromeVisible;
        const opacityVal = chromeVisible ? '1' : '0';
        document.getElementById('viewer-chrome-top').style.opacity = opacityVal;
        document.getElementById('viewer-chrome-bottom').style.opacity = opacityVal;
    }

    function fakeToast(msg) {
        console.log(msg);
    }

    function initSliders() {
        document.getElementById('slider-x').value = appConfig.x;
        document.getElementById('slider-y').value = appConfig.y;
        document.getElementById('slider-size').value = appConfig.size;
        document.getElementById('slider-rot').value = appConfig.rot;
        updateSliderLabels();

        ['slider-x', 'slider-y', 'slider-size', 'slider-rot'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                appConfig = {
                    x: parseFloat(document.getElementById('slider-x').value),
                    y: parseFloat(document.getElementById('slider-y').value),
                    size: parseInt(document.getElementById('slider-size').value),
                    rot: parseInt(document.getElementById('slider-rot').value)
                };
                updateSliderLabels();
                renderOverlay(true);
            });
        });
    }

    function updateSliderLabels() {
        document.getElementById('label-x').innerText = `${appConfig.x}%`;
        document.getElementById('label-y').innerText = `${appConfig.y}%`;
        document.getElementById('label-size').innerText = `${appConfig.size}px`;
        document.getElementById('label-rot').innerText = `${appConfig.rot}°`;
    }

    function openHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'block';
        setTimeout(() => renderOverlay(true), 50);
    }

    function closeHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'none';
        document.getElementById('preview-time-overlay').style.display = 'none';
    }

    function renderOverlay(isMenuPreview = false) {
        const overlay = isMenuPreview ? document.getElementById('preview-time-overlay') : document.getElementById('performance-time-overlay');
        const img = isMenuPreview ? document.getElementById('menu-preview-img') : document.getElementById('viewed-image');

        if (!img || !img.complete || img.naturalWidth === 0) {
            overlay.style.display = 'none';
            return;
        }

        const rect = img.getBoundingClientRect();
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const elemRatio = rect.width / rect.height;

        let renderW = rect.width;
        let renderH = rect.height;
        let renderLeft = rect.left;
        let renderTop = rect.top;

        if (elemRatio > imgRatio) {
            renderW = rect.height * imgRatio;
            renderLeft += (rect.width - renderW) / 2;
        } else {
            renderH = rect.width / imgRatio;
            renderTop += (rect.height - renderH) / 2;
        }

        const targetX = renderLeft + (renderW * (appConfig.x / 100));
        const targetY = renderTop + (renderH * (appConfig.y / 100));
        const dynamicFontSize = Math.max(10, Math.round(appConfig.size * (renderW / 240)));

        overlay.innerText = isMenuPreview ? "00:00" : targetPerformanceTime;
        overlay.style.position = 'fixed';
        overlay.style.left = `${Math.round(targetX)}px`;
        overlay.style.top = `${Math.round(targetY)}px`;
        overlay.style.fontSize = `${dynamicFontSize}px`;
        overlay.style.transform = `translate(-50%, -50%) rotate(${appConfig.rot}deg)`;
        overlay.style.display = 'block';
    }

    function saveConfiguration() {
        localStorage.setItem('mj_config', JSON.stringify(appConfig));
        alert("Settings Saved Successfully!");
    }

    window.addEventListener('resize', () => {
        if (document.getElementById('fullscreen-view').style.display === 'flex') {
            renderOverlay(false);
        } else if (document.getElementById('hidden-menu').style.display === 'block') {
            renderOverlay(true);
        }
    });

    document.getElementById('gimmick-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                gimmickBase64 = event.target.result;
                localStorage.setItem('mj_gimmick', gimmickBase64);
                document.getElementById('menu-preview-img').src = gimmickBase64;
                document.getElementById('gimmick-status').innerText = "Target Gimmick Ready";
                document.getElementById('gimmick-status').style.color = "#4cd964";
                setTimeout(() => renderOverlay(true), 100);
            };
            reader.readAsDataURL(file);
        }
    });

    /* Client-Side Bulk Photo Compression Engine */
    document.getElementById('filler-input').addEventListener('change', async function(e) {
        const files = Array.from(e.target.files).slice(0, 25);
        if (files.length === 0) return;

        document.getElementById('filler-status').innerText = "Processing photos...";
        document.getElementById('filler-status').style.color = "#ff9500";

        fillerImagesArray = [];

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxDim = 800;
                        let w = img.width;
                        let h = img.height;

                        if (w > h && w > maxDim) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else if (h > maxDim) {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }

                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.72));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        try {
            for (let i = 0; i < files.length; i++) {
                const compressed = await compressImage(files[i]);
                fillerImagesArray.push(compressed);
                document.getElementById('filler-status').innerText = `Compressing ${i + 1} / ${files.length}...`;
            }

            localStorage.setItem('mj_fillers', JSON.stringify(fillerImagesArray));
            document.getElementById('filler-status').innerText = `${fillerImagesArray.length} / 25 Photos Loaded`;
            document.getElementById('filler-status').style.color = "#4cd964";
            alert(`${fillerImagesArray.length} Bulk Photos Stored Successfully!`);
        } catch (err) {
            console.error("Storage error:", err);
            alert("Storage limit reached. Try uploading fewer photos at once.");
        }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/Clock/sw.js', { scope: '/Clock/' })
                .then(reg => console.log('SW Active!', reg))
                .catch(err => console.log('SW Failed:', err));
        });
    }
</script>
</body>
</html>
