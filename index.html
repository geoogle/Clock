<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        
        /* Hidden Menu Styling */
        #hidden-menu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; color: #fff; padding: 20px; overflow-y: auto; }
        .fancy-header { font-family: 'Georgia', serif; font-style: italic; text-align: center; font-size: 28px; color: #ff6b6b; margin-bottom: 20px; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        .control-group input[type="range"] { width: 100%; }
        .btn { display: block; width: 100%; padding: 12px; background: #007aff; border: none; color: white; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
        
        /* Preview Wrapper to perfectly mimic the gallery view */
        .preview-container { position: relative; width: 100%; height: 250px; background: #222; border: 1px dashed #444; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; overflow: hidden; }
        .preview-img, .fullscreen-img { max-width: 100%; max-height: 100%; object-fit: contain; width: auto; height: auto; display: block; }
        
        /* Absolute Coordinate Text Anchors */
        .dynamic-time { position: fixed; transform-origin: center center; white-space: nowrap; pointer-events: none; font-weight: 500; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }

        /* Lock Screen */
        #lock-screen { position: fixed; width: 100%; height: 100%; background: #111; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .passcode-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; }
        .dot.filled { background: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .key { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }

        /* Gallery Grid */
        #gallery-screen { display: none; width: 100%; height: 100%; background: #000; padding: 2px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; }
        .thumbnail { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; cursor: pointer; }

        /* Fullscreen View Container */
        #fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <!-- Passcode Lock Screen -->
    <div id="lock-screen">
        <div style="font-size: 18px; margin-bottom: 40px; font-weight: 300;">Enter Passcode</div>
        <div class="passcode-dots">
            <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
        </div>
        <div class="keypad" id="keypad"></div>
    </div>

    <!-- App Photo Gallery Screen -->
    <div id="gallery-screen"></div>

    <!-- Full Screen Photo Viewer Display Area -->
    <div id="fullscreen-view" onclick="closeFullscreen()">
        <img id="viewed-image" class="fullscreen-img" src="" alt="">
    </div>

    <!-- The Time Overlay Dynamic Layer -->
    <div id="live-time-overlay" class="dynamic-time">00:00</div>

    <!-- Hidden Setup / Tuning Control Deck Menu -->
    <div id="hidden-menu">
        <div class="fancy-header">With Love Mentalist Jagath</div>
        
        <div class="control-group">
            <label>1. Gimmick Target Photo</label>
            <input type="file" id="gimmick-input" accept="image/*">
        </div>
        <div class="control-group">
            <label>2. Bulk Filler Photos (Up to 25)</label>
            <input type="file" id="filler-input" accept="image/*" multiple>
        </div>

        <div class="preview-container">
            <img id="menu-preview-img" class="preview-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23333'/></svg>">
        </div>

        <!-- Math Positioning Axis Bars -->
        <div class="control-group"><label>Horizontal Position (X %)</label><input type="range" id="slider-x" min="0" max="100" value="50"></div>
        <div class="control-group"><label>Vertical Position (Y %)</label><input type="range" id="slider-y" min="0" max="100" value="50"></div>
        <div class="control-group"><label>Font Size (px)</label><input type="range" id="slider-size" min="10" max="100" value="30"></div>
        <div class="control-group"><label>Rotation (deg)</label><input type="range" id="slider-rot" min="-180" max="180" value="0"></div>

        <button class="btn" onclick="saveConfiguration()">Save Alignment Settings</button>
        <button class="btn" style="background:#555;" onclick="closeHiddenMenu()">Exit Configuration</button>
    </div>

    <script>
        // Data States & Config Storage Variables
        let appConfig = JSON.parse(localStorage.getItem('mj_config')) || { x: 50, y: 50, size: 30, rot: 0 };
        let gimmickBase64 = localStorage.getItem('mj_gimmick') || "";
        let fillerImagesArray = JSON.parse(localStorage.getItem('mj_fillers')) || [];
        let enteredCode = "";
        let targetPerformanceTime = "00:00";
        let gimmickedIndexInGallery = 7; // Hidden at position 8 in grid array layout

        // Two-Finger Slide Down Trigger Setup Detection
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) { touchStartY = (e.touches.clientY + e.touches.clientY) / 2; }
        });
        document.addEventListener('touchend', (e) => {
            if (touchStartY > 0) {
                let currentY = (e.changedTouches.clientY + (e.changedTouches ? e.changedTouches.clientY : e.changedTouches.clientY)) / 2;
                if (currentY - touchStartY > 120 && touchStartY < 180) { openHiddenMenu(); }
                touchStartY = 0;
            }
        });

        // Initialize App Configuration on Launch
        window.onload = function() {
            buildKeypad();
            initSliders();
            if (gimmickBase64) document.getElementById('menu-preview-img').src = gimmickBase64;
        };

        function openHiddenMenu() { document.getElementById('hidden-menu').style.display = 'block'; updateTextLayerLocation(true); }
        function closeHiddenMenu() { document.getElementById('hidden-menu').style.display = 'none'; hideTimeOverlay(); }

        function initSliders() {
            document.getElementById('slider-x').value = appConfig.x;
            document.getElementById('slider-y').value = appConfig.y;
            document.getElementById('slider-size').value = appConfig.size;
            document.getElementById('slider-rot').value = appConfig.rot;

            ['slider-x', 'slider-y', 'slider-size', 'slider-rot'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    appConfig = {
                        x: parseFloat(document.getElementById('slider-x').value),
                        y: parseFloat(document.getElementById('slider-y').value),
                        size: parseInt(document.getElementById('slider-size').value),
                        rot: parseInt(document.getElementById('slider-rot').value)
                    };
                    updateTextLayerLocation(true);
                });
            });
        }

        // Handle File Conversion for Image Storage
        document.getElementById('gimmick-input').addEventListener('change', function(e) {
            let reader = new FileReader();
            reader.onload = function() {
                gimmickBase64 = reader.result;
                document.getElementById('menu-preview-img').src = gimmickBase64;
            };
            if(e.target.files) reader.readAsDataURL(e.target.files);
        });

        document.getElementById('filler-input').addEventListener('change', function(e) {
            fillerImagesArray = [];
            let files = Array.from(e.target.files).slice(0, 25);
            let loadedCount = 0;
            files.forEach(file => {
                let reader = new FileReader();
                reader.onload = function() {
                    fillerImagesArray.push(reader.result);
                    loadedCount++;
                    if (loadedCount === files.length) {
                        localStorage.setItem('mj_fillers', JSON.stringify(fillerImagesArray));
                        alert('Filler images loaded permanently.');
                    }
                };
                reader.readAsDataURL(file);
            });
        });

        function saveConfiguration() {
            localStorage.setItem('mj_config', JSON.stringify(appConfig));
            if(gimmickBase64) localStorage.setItem('mj_gimmick', gimmickBase64);
            alert('Alignment and images permanently saved without deletions, bro!');
        }

        // --- KEY COGNITIVE ALIGNMENT LOGIC ---
        function updateTextLayerLocation(isMenuPreview = false) {
            const overlay = document.getElementById('live-time-overlay');
            const targetImg = isMenuPreview ? document.getElementById('menu-preview-img') : document.getElementById('viewed-image');
            
            if (!targetImg || !targetImg.complete || targetImg.naturalWidth === 0) {
                hideTimeOverlay();
                return;
            }

            const rect = targetImg.getBoundingClientRect();
            
            const exactPixelX = rect.left + (rect.width * (appConfig.x / 100));
            const exactPixelY = rect.top + (rect.height * (appConfig.y / 100));

            overlay.innerHTML = isMenuPreview ? "00:00" : targetPerformanceTime;
            overlay.style.position = 'fixed';
            overlay.style.left = `${exactPixelX}px`;
            overlay.style.top = `${exactPixelY}px`;
            overlay.style.fontSize = `${appConfig.size}px`;
            overlay.style.transform = `translate(-50%, -50%) rotate(${appConfig.rot}deg)`;
            overlay.style.display = 'block';
        }

        function hideTimeOverlay() { document.getElementById('live-time-overlay').style.display = 'none'; }
        window.addEventListener('resize', () => {
            const fullScreenOpen = document.getElementById('fullscreen-view').style.display === 'flex';
            const menuOpen = document.getElementById('hidden-menu').style.display === 'block';
            if (fullScreenOpen) updateTextLayerLocation(false);
            else if (menuOpen) updateTextLayerLocation(true);
        });

        function buildKeypad() {
            const container = document.getElementById('keypad');
            for (let i = 1; i <= 9; i++) {
                container.innerHTML += `<div class="key" onclick="pressKey('${i}')">${i}</div>`;
            }
            container.innerHTML += `<div class="key" style="background:transparent;"></div>`;
            container.innerHTML += `<div class="key" onclick="pressKey('0')">0</div>`;
        }

        function pressKey(num) {
            if (enteredCode.length < 4) {
                enteredCode += num;
                document.getElementById(`d${enteredCode.length}`).classList.add('filled');
            }
            if (enteredCode.length === 4) {
                setTimeout(processUnlockSequence, 200);
            }
        }

        function processUnlockSequence() {
            let hr = enteredCode.substring(0, 2);
            let min = enteredCode.substring(2, 4);
            targetPerformanceTime = `${hr}:${min}`;
            
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('gallery-screen').style.display = 'grid';
            generateGalleryGrid();
        }

        function generateGalleryGrid() {
            const grid = document.getElementById('gallery-screen');
            grid.innerHTML = "";
            
            let totalSlotsCount = Math.max(25, fillerImagesArray.length + 1);
            let fillerPointer = 0;

            for (let i = 0; i < totalSlotsCount; i++) {
                if (i === gimmickedIndexInGallery) {
                    let srcImg = gimmickBase64 || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23555'/></svg>";
                    grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(true)">`;
                } else {
                    let srcImg = fillerImagesArray[fillerPointer] || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>";
                    grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(false, '${srcImg}')">`;
                    if (fillerImagesArray[fillerPointer]) fillerPointer++;
                }
            }
        }

        function openFullscreen(isGimmick, imgSrc = "") {
            const view = document.getElementById('fullscreen-view');
            const img = document.getElementById('viewed-image');
            
            if (isGimmick) {
                img.src = gimmickBase64;
                view.style.display = 'flex';
                img.onload = function() { updateTextLayerLocation(false); };
            } else {
                img.src = imgSrc;
                view.style.display = 'flex';
                hideTimeOverlay();
            }
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-view').style.display = 'none';
            hideTimeOverlay();
        }
    </script>
</body>
</html>
