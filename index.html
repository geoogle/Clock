<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; color: #fff; }
    
    /* Passcode Screen */
    #passcode-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; background: #000; }
    .passcode-title { font-size: 20px; font-weight: 400; margin-bottom: 20px; letter-spacing: 0.5px; }
    .dots-container { display: flex; gap: 15px; margin-bottom: 60px; height: 16px; }
    .dot { width: 14px; height: 14px; border: 1.5px solid #fff; border-radius: 50%; transition: background 0.1s; }
    .dot.filled { background: #fff; }
    .keypad { display: grid; grid-template-columns: repeat(3, 75px); gap: 20px 25px; justify-content: center; }
    .key { width: 75px; height: 75px; border-radius: 50%; background: #1c1c1e; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 400; cursor: pointer; transition: background 0.1s; }
    .key:active { background: #3a3a3c; }
    .keypad-footer { display: flex; justify-content: space-between; width: 275px; margin-top: 25px; font-size: 14px; padding: 0 10px; color: #fff; }
    .footer-btn { cursor: pointer; opacity: 0.8; }
    .footer-btn:active { opacity: 1; }

    /* Gallery Screen */
    #gallery-screen { display: none; width: 100%; height: 100%; flex-direction: column; position: absolute; top: 0; left: 0; z-index: 5; background: #000; }
    .gallery-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; font-size: 17px; font-weight: 600; border-bottom: 0.5px solid #2c2c2e; background: #000; }
    .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px; overflow-y: auto; flex: 1; }
    .thumbnail-wrapper { aspect-ratio: 1/1; position: relative; overflow: hidden; background: #1c1c1e; cursor: pointer; }
    .thumbnail-img { width: 100%; height: 100%; object-fit: cover; }
    .thumbnail-overlay { position: absolute; pointer-events: none; white-space: nowrap; font-family: inherit; font-weight: bold; color: #fff; transform-origin: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

    /* Fullscreen Viewer */
    #viewer-screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 8; background: #000; justify-content: center; align-items: center; }
    .viewer-container { width: 100%; height: 100%; position: relative; display: flex; justify-content: center; align-items: center; }
    .viewer-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewer-overlay { position: absolute; pointer-events: none; white-space: nowrap; font-family: inherit; font-weight: bold; color: #fff; transform-origin: center; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .back-btn { position: absolute; top: 40px; left: 20px; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px; border: 1px solid #333; cursor: pointer; z-index: 9; }

    /* Hidden Control Deck */
    #control-deck { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 100; overflow-y: auto; padding: 30px 20px; }
    .deck-branding { font-family: 'Georgia', serif; font-style: italic; font-size: 26px; text-align: center; color: #d4af37; margin-bottom: 25px; font-weight: bold; }
    .deck-section { background: #1c1c1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2c2c2e; }
    .deck-section h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; margin-bottom: 12px; }
    .file-input-label { display: block; background: #007aff; text-align: center; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
    .file-input { display: none; }
    .status-text { font-size: 12px; color: #00e676; text-align: center; margin-top: 4px; }
    .slider-group { margin-bottom: 15px; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; margin-bottom: 5px; }
    .slider-group input { width: 100%; -webkit-appearance: none; background: #3a3a3c; height: 6px; border-radius: 3px; outline: none; }
    .slider-group input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #007aff; cursor: pointer; }
    .preview-canvas-container { width: 100%; aspect-ratio: 4/3; background: #000; position: relative; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px solid #3a3a3c; }
    .preview-img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0.6; }
    .preview-overlay { position: absolute; pointer-events: none; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .action-btn { padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
    .save-btn { background: #34c759; color: #fff; }
    .close-btn { background: #ff3b30; color: #fff; }
  </style>
</head>
<body>

  <!-- Passcode Screen -->
  <div id="passcode-screen">
    <div class="passcode-title">Enter Passcode</div>
    <div class="dots-container" id="dots-container">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="keypad">
      <div class="key" onclick="pressKey('1')">1</div>
      <div class="key" onclick="pressKey('2')">2</div>
      <div class="key" onclick="pressKey('3')">3</div>
      <div class="key" onclick="pressKey('4')">4</div>
      <div class="key" onclick="pressKey('5')">5</div>
      <div class="key" onclick="pressKey('6')">6</div>
      <div class="key" onclick="pressKey('7')">7</div>
      <div class="key" onclick="pressKey('8')">8</div>
      <div class="key" onclick="pressKey('9')">9</div>
      <div></div>
      <div class="key" onclick="pressKey('0')">0</div>
      <div></div>
    </div>
    <div class="keypad-footer">
      <div class="footer-btn">Emergency</div>
      <div class="footer-btn" onclick="deleteKey()">Delete</div>
    </div>
  </div>

  <!-- Gallery Screen -->
  <div id="gallery-screen">
    <div class="gallery-header">
      <span>Library</span>
      <span style="color: #007aff; font-weight: normal; font-size: 15px;">Select</span>
    </div>
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

  <!-- Fullscreen Viewer -->
  <div id="viewer-screen">
    <button class="back-btn" onclick="closeViewer()">✕ Close</button>
    <div class="viewer-container" id="viewer-container"></div>
  </div>

  <!-- Hidden Control Deck -->
  <div id="control-deck">
    <div class="deck-branding">With Love Mentalist Jagath</div>
    
    <div class="deck-section">
      <h3>1. Configure Photos</h3>
      <label class="file-input-label">
        📂 Upload Gimmick Target Photo
        <input type="file" class="file-input" id="gimmick-input" accept="image/*" onchange="handleGimmickUpload(event)">
      </label>
      <div id="gimmick-status" class="status-text">No image loaded</div>
      
      <label class="file-input-label" style="background: #5856d6; margin-top: 15px;">
        📚 Upload Bulk Filler Photos (Max 25)
        <input type="file" class="file-input" id="fillers-input" accept="image/*" multiple onchange="handleFillersUpload(event)">
      </label>
      <div id="fillers-status" class="status-text">0 / 25 Photos Loaded</div>
    </div>

    <div class="deck-section">
      <h3>2. Fine-tune Alignment Axes</h3>
      <div class="slider-group">
        <label>Horizontal Position (X) <span id="val-x">50%</span></label>
        <input type="range" id="slider-x" min="0" max="100" value="50" oninput="updateLiveAlignment()">
      </div>
      <div class="slider-group">
        <label>Vertical Position (Y) <span id="val-y">50%</span></label>
        <input type="range" id="slider-y" min="0" max="100" value="50" oninput="updateLiveAlignment()">
      </div>
      <div class="slider-group">
        <label>Font Size <span id="val-size">24px</span></label>
        <input type="range" id="slider-size" min="10" max="100" value="24" oninput="updateLiveAlignment()">
      </div>
      <div class="slider-group">
        <label>Rotation Angle <span id="val-rot">0°</span></label>
        <input type="range" id="slider-rot" min="-180" max="180" value="0" oninput="updateLiveAlignment()">
      </div>
    </div>

    <div class="deck-section">
      <h3>Alignment Canvas Preview</h3>
      <div class="preview-canvas-container">
        <img id="preview-img-element" class="preview-img" src="" style="display:none;">
        <div id="preview-overlay-text" class="preview-overlay">00:00</div>
      </div>
      <div class="btn-row">
        <button class="action-btn save-btn" onclick="saveConfiguration()">Save Settings</button>
        <button class="action-btn close-btn" onclick="closeControlDeck()">Close Menu</button>
      </div>
    </div>
  </div>

  <script>
    // State management variables
    let pinCode = "";
    let gimmickPhotoData = "";
    let fillerPhotosData = [];
    let currentSpectatorTime = "00:00";
    let gimmickIndex = 4; // Default index in gallery matrix
    
    let alignmentSettings = { x: 50, y: 50, size: 24, rot: 0 };

    // --- Core Startup Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      loadPersistentData();
      setupHiddenMenuGesture();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log("SW failed", err));
      }
    });

    function loadPersistentData() {
      const savedSettings = localStorage.getItem('mj_alignment');
      if (savedSettings) {
        alignmentSettings = JSON.parse(savedSettings);
        document.getElementById('slider-x').value = alignmentSettings.x;
        document.getElementById('slider-y').value = alignmentSettings.y;
        document.getElementById('slider-size').value = alignmentSettings.size;
        document.getElementById('slider-rot').value = alignmentSettings.rot;
      }
      
      const savedGimmick = localStorage.getItem('mj_gimmick');
      if (savedGimmick) {
        gimmickPhotoData = savedGimmick;
        document.getElementById('gimmick-status').innerText = "✅ Target Gimmick Loaded Permanently";
        document.getElementById('preview-img-element').src = gimmickPhotoData;
        document.getElementById('preview-img-element').style.display = "block";
      }

      const savedFillers = localStorage.getItem('mj_fillers');
      if (savedFillers) {
        fillerPhotosData = JSON.parse(savedFillers);
        document.getElementById('fillers-status').innerText = `✅ ${fillerPhotosData.length} Bulk Photos Loaded Permanently`;
      }
      updateLiveAlignment();
    }

    // --- Two-Finger Top Swipe Workspace Gesture ---
    function setupHiddenMenuGesture() {
      let touchStartPoints = [];
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          touchStartPoints = [e.touches[0].clientY, e.touches[1].clientY];
        }
      }, { passive: true });

      window.addEventListener('touchend', (e) => {
        if (touchStartPoints.length === 2) {
          const avgStartY = (touchStartPoints[0] + touchStartPoints[1]) / 2;
          if (avgStartY < 150) { 
            document.getElementById('control-deck').style.display = 'block';
          }
          touchStartPoints = [];
        }
      }, { passive: true });
    }

    // --- Keypad Unlock Engine ---
    function pressKey(digit) {
      if (pinCode.length < 4) {
        pinCode += digit;
        updateDots();
        if (pinCode.length === 4) {
          setTimeout(processPasscodeTime, 200);
        }
      }
    }

    function deleteKey() {
      if (pinCode.length > 0) {
        pinCode = pinCode.slice(0, -1);
        updateDots();
      }
    }

    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx < pinCode.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function processPasscodeTime() {
      const hh = pinCode.substring(0, 2);
      const mm = pinCode.substring(2, 4);
      currentSpectatorTime = `${hh}:${mm}`;
      
      buildGalleryGrid();
      document.getElementById('passcode-screen').style.display = 'none';
      document.getElementById('gallery-screen').style.display = 'flex';
    }

    // --- Core Canvas Alignment Logic ---
    function updateLiveAlignment() {
      alignmentSettings.x = document.getElementById('slider-x').value;
      alignmentSettings.y = document.getElementById('slider-y').value;
      alignmentSettings.size = document.getElementById('slider-size').value;
      alignmentSettings.rot = document.getElementById('slider-rot').value;

      document.getElementById('val-x').innerText = alignmentSettings.x + "%";
      document.getElementById('val-y').innerText = alignmentSettings.y + "%";
      document.getElementById('val-size').innerText = alignmentSettings.size + "px";
      document.getElementById('val-rot').innerText = alignmentSettings.rot + "°";

      const overlay = document.getElementById('preview-overlay-text');
      overlay.style.left = alignmentSettings.x + "%";
      overlay.style.top = alignmentSettings.y + "%";
      overlay.style.fontSize = alignmentSettings.size + "px";
      overlay.style.transform = `translate(-50%, -50%) rotate(${alignmentSettings.rot}deg)`;
    }

    function saveConfiguration() {
      localStorage.setItem('mj_alignment', JSON.stringify(alignmentSettings));
      alert("Settings permanently locked in!");
    }

    function closeControlDeck() {
      document.getElementById('control-deck').style.display = 'none';
    }

    // --- Image Persistent Processing ---
    function handleGimmickUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        gimmickPhotoData = event.target.result;
        localStorage.setItem('mj_gimmick', gimmickPhotoData);
        document.getElementById('gimmick-status').innerText = "✅ Target Gimmick Saved Permanently";
        document.getElementById('preview-img-element').src = gimmickPhotoData;
        document.getElementById('preview-img-element').style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function handleFillersUpload(e) {
      const files = Array.from(e.target.files).slice(0, 25);
      fillerPhotosData = [];
      let processedCount = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(event) {
          fillerPhotosData.push(event.target.result);
          processedCount++;
          if (processedCount === files.length) {
            localStorage.setItem('mj_fillers', JSON.stringify(fillerPhotosData));
            document.getElementById('fillers-status').innerText = `✅ ${fillerPhotosData.length} Bulk Photos Saved Permanently`;
          }
        };
        reader.readAsDataURL(file);
      });
    }

    // --- Dynamic Gallery Construction Engine ---
    function buildGalleryGrid() {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = "";
      
      // Enforce up to 25 items total
      const totalDisplayCount = Math.max(25, fillerPhotosData.length + 1);
      gimmickIndex = Math.min(4, totalDisplayCount - 1); 

      let fillerPtr = 0;
      for (let i = 0; i < totalDisplayCount; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'thumbnail-wrapper';
        
        if (i === gimmickIndex && gimmickPhotoData) {
          // Dynamic generation of target photo item
          const img = document.createElement('img');
          img.className = 'thumbnail-img';
          img.src = gimmickPhotoData;
          wrapper.appendChild(img);

          const timeText = document.createElement('div');
          timeText.className = 'thumbnail-overlay';
          timeText.innerText = currentSpectatorTime;
          // Apply scale reduction factor for standard gallery thumb grid layout
          timeText.style.left = alignmentSettings.x + "%";
          timeText.style.top = alignmentSettings.y + "%";
          timeText.style.fontSize = (alignmentSettings.size * 0.35) + "px";
          timeText.style.transform = `translate(-50%, -50%) rotate(${alignmentSettings.rot}deg)`;
          wrapper.appendChild(timeText);
          
          wrapper.onclick = () => openViewer(true);
        } else {
          const img = document.createElement('img');
          img.className = 'thumbnail-img';
          // Pull permanent stock photo asset or fallback placeholder thumbnail
          img.src = fillerPhotosData[fillerPtr] || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231c1c1e'/></svg>";
          wrapper.appendChild(img);
          
          const currentImgSrc = img.src;
          wrapper.onclick = () => openViewer(false, currentImgSrc);
          if (fillerPhotosData[fillerPtr]) fillerPtr++;
        }
        grid.appendChild(wrapper);
      }
    }

    // --- Fullscreen Display Pipeline ---
    function openViewer(isGimmick, imgSrc = "") {
      const container = document.getElementById('viewer-container');
      container.innerHTML = "";
      
      const img = document.createElement('img');
      img.className = 'viewer-img';
      
      if (isGimmick) {
        img.src = gimmickPhotoData;
        container.appendChild(img);

        const timeText = document.createElement('div');
        timeText.className = 'viewer-overlay';
        timeText.innerText = currentSpectatorTime;
        timeText.style.left = alignmentSettings.x + "%";
        timeText.style.top = alignmentSettings.y + "%";
        timeText.style.fontSize = alignmentSettings.size + "px";
        timeText.style.transform = `translate(-50%, -50%) rotate(${alignmentSettings.rot}deg)`;
        container.appendChild(timeText);
      } else {
        img.src = imgSrc;
        container.appendChild(img);
      }
      
      document.getElementById('viewer-screen').style.display = 'flex';
    }

    function closeViewer() {
      document.getElementById('viewer-screen').style.display = 'none';
    }
  </script>
</body>
</html>
