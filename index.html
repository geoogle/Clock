<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        /* Lock Screen */
        #lock-screen { position: fixed; width: 100%; height: 100%; background: #111; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .passcode-dots { display: flex; gap: 15px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border: 2px solid white; border-radius: 50%; }
        .dot.filled { background: white; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .key { width: 75px; height: 75px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; }

        /* Gallery Grid */
        #gallery-screen { display: none; width: 100%; height: 100%; background: #000; padding: 2px; overflow-y: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; align-content: start; }
        .thumbnail { width: 100%; aspect-ratio: 1; object-fit: cover; background: #222; cursor: pointer; }

        /* Fullscreen View Container */
        #fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; }
        #viewed-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Performance Time Layer */
        #live-time-overlay {
            position: fixed;
            transform-origin: center center;
            white-space: nowrap;
            pointer-events: none;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            z-index: 6000;
            display: none;
        }

        /* Hidden Menu Styling */
        #hidden-menu { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 99999; color: #fff; }
        
        /* Direct Calibration Stage: Fill the screen so it matches performance 1:1 */
        #calib-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #calib-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Draggable Target in Calibration */
        #draggable-time {
            position: fixed;
            transform-origin: center center;
            white-space: nowrap;
            font-weight: 600;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            background: rgba(0, 122, 255, 0.4);
            border: 1px dashed #007aff;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: move;
            touch-action: none;
            z-index: 100000;
        }

        /* Bottom Controls Bar */
        #calib-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bar-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .bar-row label { font-size: 12px; color: #aaa; }
        .bar-btn { padding: 8px 14px; background: #333; border: 1px solid #555; color: white; border-radius: 6px; font-size: 13px; font-weight: bold; }
        .save-btn { background: #34c759; border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; }
        .exit-btn { background: #ff3b30; border: none; color: white; padding: 10px; border-radius: 8px; font-weight: bold; flex: 1; }
    </style>
</head>
<body>

<!-- Passcode Lock Screen -->
<div id="lock-screen">
    <div style="font-size: 18px; margin-bottom: 40px; font-weight: 300;">Enter Passcode</div>
    <div class="passcode-dots">
        <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div><div class="dot" id="d4"></div>
    </div>
    <div class="keypad" id="keypad"></div>
</div>

<!-- Gallery Grid -->
<div id="gallery-screen"></div>

<!-- Full Screen Performance View -->
<div id="fullscreen-view" onclick="closeFullscreen()">
    <img id="viewed-image" src="" alt="">
    <div id="live-time-overlay">00:00</div>
</div>

<!-- Visual Calibration Deck -->
<div id="hidden-menu">
    <div id="calib-viewport">
        <img id="calib-img" src="" alt="">
        <div id="draggable-time">00:00</div>
    </div>

    <div id="calib-bar">
        <div class="bar-row">
            <label>Upload Photo:</label>
            <input type="file" id="gimmick-input" accept="image/*" style="font-size: 11px; width: 180px;">
        </div>

        <div class="bar-row">
            <span style="font-size: 12px; color:#aaa;">Size:</span>
            <button class="bar-btn" onclick="adjustSize(-2)">A-</button>
            <button class="bar-btn" onclick="adjustSize(2)">A+</button>
            <span style="font-size: 12px; color:#aaa;">Angle:</span>
            <button class="bar-btn" onclick="adjustRot(-1)">↺ -1°</button>
            <button class="bar-btn" onclick="adjustRot(1)">↻ +1°</button>
        </div>

        <div class="bar-row">
            <button class="save-btn" onclick="saveConfiguration()">Save Position</button>
            <button class="exit-btn" onclick="closeHiddenMenu()">Exit Menu</button>
        </div>
    </div>
</div>

<script>
    // Configuration in pure normalized ratios of the image (0.0 to 1.0)
    let appConfig = JSON.parse(localStorage.getItem('mj_config_v2')) || {
        normX: 0.58,
        normY: 0.73,
        fontSizeRatio: 0.055, // Ratio of image width
        rot: -1
    };

    let gimmickBase64 = localStorage.getItem('mj_gimmick') || "";
    let fillerImagesArray = JSON.parse(localStorage.getItem('mj_fillers')) || [];
    let enteredCode = "";
    let targetPerformanceTime = "00:00";
    let gimmickedIndexInGallery = 7;

    // Two-Finger Slide Down
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            touchStartY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        }
    });
    document.addEventListener('touchend', (e) => {
        if (touchStartY > 0) {
            let currentY = (e.changedTouches[0].clientY + (e.changedTouches[1] ? e.changedTouches[1].clientY : e.changedTouches[0].clientY)) / 2;
            if (currentY - touchStartY > 120 && touchStartY < 220) {
                openHiddenMenu();
            }
            touchStartY = 0;
        }
    });

    window.onload = function() {
        buildKeypad();
        if (gimmickBase64) {
            document.getElementById('calib-img').src = gimmickBase64;
        }
        setupDrag();
    };

    function openHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'block';
        setTimeout(renderCalibrationBox, 80);
    }

    function closeHiddenMenu() {
        document.getElementById('hidden-menu').style.display = 'none';
    }

    /* Helper: Returns the exact rendered pixel rectangle of the photo */
    function getImageRenderedBounds(img) {
        const rect = img.getBoundingClientRect();
        if (!img.naturalWidth || !img.naturalHeight) return rect;

        const imgRatio = img.naturalWidth / img.naturalHeight;
        const elemRatio = rect.width / rect.height;

        let w = rect.width;
        let h = rect.height;
        let x = rect.left;
        let y = rect.top;

        if (elemRatio > imgRatio) {
            w = h * imgRatio;
            x += (rect.width - w) / 2;
        } else {
            h = w / imgRatio;
            y += (rect.height - h) / 2;
        }

        return { left: x, top: y, width: w, height: h };
    }

    /* Position the draggable box during calibration */
    function renderCalibrationBox() {
        const img = document.getElementById('calib-img');
        const box = document.getElementById('draggable-time');
        if (!img.complete || img.naturalWidth === 0) return;

        const bounds = getImageRenderedBounds(img);

        const px = bounds.left + (bounds.width * appConfig.normX);
        const py = bounds.top + (bounds.height * appConfig.normY);
        const fSize = bounds.width * appConfig.fontSizeRatio;

        box.style.left = `${Math.round(px)}px`;
        box.style.top = `${Math.round(py)}px`;
        box.style.fontSize = `${Math.round(fSize)}px`;
        box.style.transform = `translate(-50%, -50%) rotate(${appConfig.rot}deg)`;
    }

    /* Drag Engine */
    function setupDrag() {
        const box = document.getElementById('draggable-time');
        let isDragging = false;

        function start(e) {
            isDragging = true;
            e.preventDefault();
        }

        function move(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const img = document.getElementById('calib-img');
            const bounds = getImageRenderedBounds(img);

            // Calculate normalized image coordinates (0.0 to 1.0)
            let nx = (clientX - bounds.left) / bounds.width;
            let ny = (clientY - bounds.top) / bounds.height;

            // Clamp inside image
            nx = Math.max(0, Math.min(1, nx));
            ny = Math.max(0, Math.min(1, ny));

            appConfig.normX = nx;
            appConfig.normY = ny;

            renderCalibrationBox();
        }

        function end() {
            isDragging = false;
        }

        box.addEventListener('mousedown', start);
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);

        box.addEventListener('touchstart', start, { passive: false });
        window.addEventListener('touchmove', move, { passive: false });
        window.addEventListener('touchend', end);
    }

    function adjustSize(delta) {
        appConfig.fontSizeRatio += (delta * 0.003);
        renderCalibrationBox();
    }

    function adjustRot(delta) {
        appConfig.rot += delta;
        renderCalibrationBox();
    }

    function saveConfiguration() {
        localStorage.setItem('mj_config_v2', JSON.stringify(appConfig));
        alert("Position Locked! It will now appear exactly where you dragged it.");
    }

    /* Performance View Renderer */
    function renderPerformanceOverlay() {
        const overlay = document.getElementById('live-time-overlay');
        const img = document.getElementById('viewed-image');

        if (!img.complete || img.naturalWidth === 0) return;

        const bounds = getImageRenderedBounds(img);

        const px = bounds.left + (bounds.width * appConfig.normX);
        const py = bounds.top + (bounds.height * appConfig.normY);
        const fSize = bounds.width * appConfig.fontSizeRatio;

        overlay.innerText = targetPerformanceTime;
        overlay.style.left = `${Math.round(px)}px`;
        overlay.style.top = `${Math.round(py)}px`;
        overlay.style.fontSize = `${Math.round(fSize)}px`;
        overlay.style.transform = `translate(-50%, -50%) rotate(${appConfig.rot}deg)`;
        overlay.style.display = 'block';
    }

    function buildKeypad() {
        const container = document.getElementById('keypad');
        container.innerHTML = "";
        for (let i = 1; i <= 9; i++) {
            container.innerHTML += `<div class="key" onclick="pressKey('${i}')">${i}</div>`;
        }
        container.innerHTML += `<div class="key" style="background:transparent;"></div>`;
        container.innerHTML += `<div class="key" onclick="pressKey('0')">0</div>`;
    }

    function pressKey(num) {
        if (enteredCode.length < 4) {
            enteredCode += num;
            document.getElementById(`d${enteredCode.length}`).classList.add('filled');
        }
        if (enteredCode.length === 4) {
            setTimeout(processUnlockSequence, 180);
        }
    }

    function processUnlockSequence() {
        let hr = enteredCode.substring(0, 2);
        let min = enteredCode.substring(2, 4);
        targetPerformanceTime = `${hr}:${min}`;

        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('gallery-screen').style.display = 'grid';
        generateGalleryGrid();
    }

    function generateGalleryGrid() {
        const grid = document.getElementById('gallery-screen');
        grid.innerHTML = "";

        let totalSlotsCount = Math.max(25, fillerImagesArray.length + 1);
        let fillerPointer = 0;

        for (let i = 0; i < totalSlotsCount; i++) {
            if (i === gimmickedIndexInGallery) {
                let srcImg = gimmickBase64 || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23555'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(true)">`;
            } else {
                let srcImg = fillerImagesArray[fillerPointer] || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='%23222'/></svg>";
                grid.innerHTML += `<img class="thumbnail" src="${srcImg}" onclick="openFullscreen(false, '${srcImg}')">`;
                if (fillerImagesArray[fillerPointer]) fillerPointer++;
            }
        }
    }

    function openFullscreen(isGimmick, imgSrc = "") {
        const view = document.getElementById('fullscreen-view');
        const img = document.getElementById('viewed-image');
        const overlay = document.getElementById('live-time-overlay');

        if (isGimmick) {
            img.src = gimmickBase64;
            view.style.display = 'block';

            img.onload = () => renderPerformanceOverlay();
            if (img.complete) renderPerformanceOverlay();
        } else {
            img.src = imgSrc;
            view.style.display = 'block';
            overlay.style.display = 'none';
        }
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-view').style.display = 'none';
        document.getElementById('live-time-overlay').style.display = 'none';
    }

    document.getElementById('gimmick-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                gimmickBase64 = event.target.result;
                localStorage.setItem('mj_gimmick', gimmickBase64);
                document.getElementById('calib-img').src = gimmickBase64;
                setTimeout(renderCalibrationBox, 100);
            };
            reader.readAsDataURL(file);
        }
    });
</script>
</body>
</html>
